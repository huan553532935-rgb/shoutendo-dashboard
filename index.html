<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寿仁堂 · 内部数据看板</title>
<style>
  :root {
    --green-50: #f0fdf4;
    --green-100: #dcfce7;
    --green-200: #bbf7d0;
    --green-300: #86efac;
    --green-500: #22c55e;
    --green-600: #16a34a;
    --green-700: #15803d;
    --green-800: #166534;
    --green-900: #14532d;
    --white: #ffffff;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #111827;
    --radius: 12px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-logo {
    width: 36px;
    height: 36px;
    background: var(--green-600);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: 700;
  }
  .header-name { font-size: 18px; font-weight: 600; color: var(--gray-900); }
  .header-badge {
    background: var(--green-50);
    color: var(--green-700);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 100px;
    font-weight: 500;
  }
  .header-date { font-size: 14px; color: var(--gray-500); }

  /* ── Layout ── */
  .main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 48px;
  }

  /* ── KPI Grid ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }
  .kpi-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--gray-200);
    transition: box-shadow 0.2s;
  }
  .kpi-card:hover { box-shadow: var(--shadow-md); }
  .kpi-label {
    font-size: 13px;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .kpi-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--green-800);
    letter-spacing: -0.02em;
  }
  .kpi-sub {
    font-size: 13px;
    color: var(--gray-400);
    margin-top: 6px;
  }
  .kpi-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .kpi-icon--revenue  { background: var(--green-100); color: var(--green-700); }
  .kpi-icon--products { background: var(--green-50);  color: var(--green-600); }
  .kpi-icon--txns     { background: var(--green-200); color: var(--green-800); }

  /* ── Table Card ── */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--gray-200);
    overflow: hidden;
  }
  .card-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--gray-100);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
  }
  .card-header-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green-500);
  }
  .card-body { padding: 0; }
  .card-body--pad { padding: 24px; }

  /* ── Table ── */
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--gray-500);
    padding: 14px 24px;
    background: var(--gray-50);
    border-bottom: 1px solid var(--gray-200);
    font-weight: 500;
  }
  tbody td {
    padding: 16px 24px;
    border-bottom: 1px solid var(--gray-100);
    font-size: 14px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--green-50); }
  .rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
  }
  .rank--1 { background: #fef3c7; color: #92400e; }
  .rank--2 { background: #e5e7eb; color: #4b5563; }
  .rank--3 { background: #fed7aa; color: #9a3412; }
  .revenue-bar-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .revenue-bar {
    height: 6px;
    border-radius: 3px;
    background: var(--green-300);
    min-width: 4px;
  }

  /* ── Stats Row ── */
  .stats-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .stat-item {
    flex: 1;
    min-width: 120px;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--green-800);
  }
  .stat-label {
    font-size: 13px;
    color: var(--gray-500);
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .header { padding: 0 16px; }
    .header-date { display: none; }
    .main { padding: 20px 16px 40px; }
    .kpi-value { font-size: 28px; }
    thead th, tbody td { padding: 12px 16px; }
    .stats-row { flex-direction: column; gap: 16px; }
  }
  @media (max-width: 480px) {
    .header-name { font-size: 16px; }
    .header-badge { display: none; }
    .kpi-card { padding: 18px; }
  }
  /* ── Trend Chart ── */
  .chart-card { margin-bottom: 24px; }
  .chart-body { padding: 20px 24px 24px; position: relative; }
  .chart-body canvas { width: 100% !important; height: auto !important; max-height: 340px; }

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="header-logo">寿</div>
    <span class="header-name">寿仁堂</span>
    <span class="header-badge">内部看板</span>
  </div>
  <span class="header-date" id="currentDate"></span>
</header>

<main class="main">
  <!-- KPI Cards -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-icon kpi-icon--revenue">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div class="kpi-label"><span class="month-label">4月</span>营收</div>
      <div class="kpi-value" id="monthlyRevenue">--</div>
      <div class="kpi-sub" id="revenueChange"></div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon kpi-icon--txns">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      </div>
      <div class="kpi-label"><span class="month-label">4月</span>交易笔数</div>
      <div class="kpi-value" id="monthlyTxns">--</div>
      <div class="kpi-sub" id="txnChange"></div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon kpi-icon--products">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      </div>
      <div class="kpi-label">商品动销率</div>
      <div class="kpi-value" id="sellThrough">--</div>
      <div class="kpi-sub">171 活跃 / 366 总 SKU</div>
    </div>
  </div>

  <!-- Top Products -->
  <div class="card" style="margin-bottom: 24px;">
    <div class="card-header">
      <span class="card-header-dot"></span> <span class="month-label">4月</span>营收 TOP 3 产品
    </div>
    <div class="card-body">
      <table>
        <thead>
          <tr>
            <th style="width:50px">排名</th>
            <th>产品名称</th>
            <th style="width:100px">品类</th>
            <th style="width:120px;text-align:right">营收</th>
            <th style="width:80px;text-align:right">销量</th>
          </tr>
        </thead>
        <tbody id="topProductsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Trend Chart -->
  <div class="card chart-card">
    <div class="card-header">
      <span class="card-header-dot"></span> 重点品种趋势图
      <span style="font-size:12px;color:var(--gray-400);font-weight:400;margin-left:auto">近4周</span>
    </div>
    <div class="card-body chart-body">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <!-- Quick Stats -->
  <div class="card">
    <div class="card-header">
      <span class="card-header-dot"></span> 概览
    </div>
    <div class="card-body card-body--pad">
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-value" id="avgOrderValue">--</div>
          <div class="stat-label">客单价</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="topCategory">--</div>
          <div class="stat-label">最畅销品类</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalProducts">--</div>
          <div class="stat-label">在售产品数</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
// ⚠️ 此数据块由 build.py 自动生成，请勿手动编辑。
// 更新数据：替换 每日销售明细.csv 后运行 python3 build.py
// ── Real data from 每日销售明细.csv (04月 = latest complete month) ──
const data = {
  monthLabel: "04月",
  monthlyRevenue: 2518377,
  lastMonthRevenue: 3735454,
  monthlyTxns: 1399,
  lastMonthTxns: 1528,
  revChange: -32.6,
  txnChange: -8.4,
  sellThrough: 47,
  totalProducts: 366,
  activeProducts: 171,
  avgOrderValue: 1800,
  topCategory: "蛋白类",
  products: [
    { name: "丙球 (康宝）", category: "丙球类", revenue: 382620, units: 447 },
    { name: "蛋白（绿十字）", category: "蛋白类", revenue: 284868, units: 528 },
    { name: "普乐沙福", category: "抗癌类", revenue: 272600, units: 17 }
  ],
};

// ── Format ──
const fmtCurrency = (n) => "\xA5" + n.toLocaleString("zh-CN");

// ── Populate KPI cards ──
document.getElementById("monthlyRevenue").textContent = fmtCurrency(data.monthlyRevenue);
document.getElementById("monthlyTxns").textContent = data.monthlyTxns.toLocaleString("zh-CN");
document.getElementById("sellThrough").textContent = data.sellThrough + "%";

const revSign = data.revChange >= 0 ? "+" : "";
const txnSign = data.txnChange >= 0 ? "+" : "";
document.getElementById("revenueChange").textContent =
  `环比 ${revSign}${data.revChange}%`;
document.getElementById("txnChange").textContent =
  `环比 ${txnSign}${data.txnChange}%`;

// ── Dynamic month labels ──
document.querySelectorAll(".month-label").forEach(el => {
  el.textContent = data.monthLabel;
});

document.getElementById("avgOrderValue").textContent = fmtCurrency(data.avgOrderValue);
document.getElementById("topCategory").textContent = data.topCategory;
document.getElementById("totalProducts").textContent = data.totalProducts;

// ── Top products table ──
const rankClass = ["rank--1", "rank--2", "rank--3"];
const maxRev = data.products[0].revenue;
const tbody = document.getElementById("topProductsBody");
data.products.forEach((p, i) => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><span class="rank ${rankClass[i]}">${i + 1}</span></td>
    <td style="font-weight:500">${p.name}</td>
    <td><span style="background:var(--green-50);color:var(--green-700);padding:2px 8px;border-radius:4px;font-size:12px">${p.category}</span></td>
    <td style="text-align:right;font-weight:600">
      <div class="revenue-bar-wrap" style="justify-content:flex-end">
        <span>${fmtCurrency(p.revenue)}</span>
        <div class="revenue-bar" style="width:${(p.revenue / maxRev * 60)}px"></div>
      </div>
    </td>
    <td style="text-align:right;color:var(--gray-500)">${p.units} 件</td>
  `;
  tbody.appendChild(tr);
});


// ── Trend Chart (近4周) ──
// ⚠️ 模拟数据 — 替换为真实数据时修改下方的 labels 和 datasets
(function() {
  const ctx = document.getElementById("trendChart");
  if (!ctx) return;

  const labels = ["第1周", "第2周", "第3周", "第4周"];

  const datasets = [
    {
      label: "普乐沙福",
      data: [82000, 65000, 58800, 68200],
      borderColor: "#16a34a",
      backgroundColor: "rgba(22,163,74,0.06)",
      borderWidth: 2.5,
      tension: 0.35,
      fill: true,
      pointRadius: 4,
      pointBackgroundColor: "#16a34a",
      pointBorderColor: "#fff",
      pointBorderWidth: 2,
      pointHoverRadius: 6,
    },
    {
      label: "蛋白（绿十字）",
      data: [71000, 73000, 69200, 71200],
      borderColor: "#2563eb",
      backgroundColor: "rgba(37,99,235,0.04)",
      borderWidth: 2.5,
      tension: 0.35,
      fill: true,
      pointRadius: 4,
      pointBackgroundColor: "#2563eb",
      pointBorderColor: "#fff",
      pointBorderWidth: 2,
      pointHoverRadius: 6,
    },
    {
      label: "丙球（康宝）",
      data: [95000, 88000, 102000, 95600],
      borderColor: "#d97706",
      backgroundColor: "rgba(217,119,6,0.04)",
      borderWidth: 2.5,
      tension: 0.35,
      fill: true,
      pointRadius: 4,
      pointBackgroundColor: "#d97706",
      pointBorderColor: "#fff",
      pointBorderWidth: 2,
      pointHoverRadius: 6,
    },
  ];

  new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: "index",
        intersect: false,
      },
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            usePointStyle: true,
            pointStyleWidth: 8,
            padding: 24,
            font: { size: 13, family: "inherit" },
            color: "#374151",
          },
        },
        tooltip: {
          backgroundColor: "#fff",
          titleColor: "#111827",
          bodyColor: "#374151",
          borderColor: "#e5e7eb",
          borderWidth: 1,
          padding: 12,
          cornerRadius: 8,
          displayColors: true,
          callbacks: {
            label: function(ctx) {
              return ctx.dataset.label + ": \xA5" + ctx.parsed.y.toLocaleString("zh-CN");
            },
          },
        },
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: "#9ca3af", font: { size: 12 } },
          border: { color: "#e5e7eb" },
        },
        y: {
          position: "right",
          grid: { color: "#f3f4f6" },
          border: { display: false },
          ticks: {
            color: "#9ca3af",
            font: { size: 11 },
            callback: function(v) { return "\xA5" + (v / 10000).toFixed(1) + "万"; },
          },
        },
      },
    },
  });
})();

// ── Date ──
const now = new Date();
document.getElementById("currentDate").textContent =
  now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";
</script>

</body>
</html>
